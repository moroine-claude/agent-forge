# Recette du relais (#103) : un changement de CI publié par SSH.
# Light CI: the CLI's tests and type check, ansible-lint, a Betterleaks secret
# scan of the commits being added, and the host
# playbook's controller-only unit tests. The playbook's real test is
# ansible/tests/vm-test.sh, run on a host with KVM (not in CI).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cli:
    runs-on: ubuntu-26.04
    # The contract tests commit in throwaway repositories, and the runner's
    # account has no name git can use as an identity.
    env:
      GIT_AUTHOR_NAME: agent-forge CI
      GIT_AUTHOR_EMAIL: ci@agent-forge.invalid
      GIT_COMMITTER_NAME: agent-forge CI
      GIT_COMMITTER_EMAIL: ci@agent-forge.invalid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # jq: tests/test-pre-bash.sh.
      - name: Install the test tools
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Install herdr (pinned, for the herdr contract tests)
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/herdr" https://github.com/herdrdev/herdr/releases/download/v0.9.5/herdr-linux-x86_64
          echo "14d9e8bc8b4a9e0118d77c32266f76d461f09b40342eb23752960bd89f59929d  $HOME/.local/bin/herdr" | sha256sum -c -
          chmod +x "$HOME/.local/bin/herdr"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm test
      - run: npm run check

  ansible-lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ansible/ansible-lint@9bce2bfb8f4a984e6b13767bc0d6bf0a49492164 # v26.10.1
        with:
          args: ansible/
          requirements_file: ansible/requirements.yml

  ansible-unit:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install ansible-core
        run: |
          sudo apt-get update && sudo apt-get install -y pipx
          pipx install 'ansible-core>=2.20,<2.21'
      - name: Run the controller-only unit tests
        run: ansible-playbook -i ansible/tests/unit-inventory.yml ansible/tests/unit.yml

  # Secret scan of the commits being added (the history is scanned once by
  # hand, see docs/superpowers/specs/2026-11-06-open-source-publication-design.md).
  secrets:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Betterleaks (pinned)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/betterleaks.tar.gz" https://github.com/betterleaks/betterleaks/releases/download/v1.10.0/betterleaks_1.10.0_linux_x64.tar.gz
          echo "9d9ad503cd5d80d18a939352266c3fcca52f10da9b83cd5cfe646989b13940fe  $RUNNER_TEMP/betterleaks.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$RUNNER_TEMP/betterleaks.tar.gz" -C "$HOME/.local/bin" betterleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Scan the commits being added
        env:
          SCAN_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          SCAN_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: bash .github/scripts/scan-secrets.sh "$SCAN_BASE" "$SCAN_HEAD"
