---
- name: Forge CLI entry point
  hosts: render
  gather_facts: false
  # The role links /usr/local/bin/forge to <release>/<entry point> without
  # checking that the target exists: a stale entry point leaves a dangling
  # link and no forge on the host. Check it against this checkout instead.
  vars_files:
    - ../../roles/forge_users/defaults/main.yml
  vars:
    # The role's default derives the repository root from site.yml's
    # directory; here the playbook lives three levels below the root.
    unit_repo_root: "{{ (playbook_dir ~ '/../../..') | realpath }}"
  tasks:
    - name: Stat the entry point in this checkout
      ansible.builtin.stat:
        path: "{{ unit_repo_root }}/{{ forge_users_cli_entrypoint }}"
      register: unit_entrypoint

    - name: Check that the entry point is an executable file
      ansible.builtin.assert:
        that:
          - unit_entrypoint.stat.exists
          - unit_entrypoint.stat.isreg
          - unit_entrypoint.stat.executable
        fail_msg: >-
          forge_users_cli_entrypoint ({{ forge_users_cli_entrypoint }}) is not
          an executable file in {{ unit_repo_root }}

- name: Node version on the host
  hosts: render
  gather_facts: false
  # A bare "nodejs" with state: present keeps a Node already installed from
  # Ubuntu (22 on 26.04), and the forge CLI refuses to run on it. The package
  # must carry the CLI's floor as its minimum, from a repository that serves
  # that major.
  vars_files:
    - ../../roles/forge_users/defaults/main.yml
  vars:
    unit_repo_root: "{{ (playbook_dir ~ '/../../..') | realpath }}"
    # The guard in cli/forge: `if ! [ "$major" -ge 24 ]`.
    unit_cli_floor: >-
      {{ lookup('ansible.builtin.file', unit_repo_root ~ '/cli/forge')
         | regex_search('"\$major" -ge (\d+)', '\1') | first }}
    unit_repo_major: >-
      {{ forge_users_nodesource_uri | regex_search('/node_(\d+)\.x$', '\1') | first }}
  tasks:
    - name: Check the nodejs package's minimum is the CLI's floor
      ansible.builtin.assert:
        that:
          - (forge_users_packages | select('match', 'nodejs') | list) == ['nodejs>=' ~ unit_cli_floor]
          - unit_repo_major == unit_cli_floor
        fail_msg: >-
          forge_users_packages must hold nodejs>={{ unit_cli_floor }} (cli/forge's
          floor), from NodeSource's node_{{ unit_cli_floor }}.x: got
          {{ forge_users_packages | select('match', 'nodejs') | list }} and
          {{ forge_users_nodesource_uri }}

- name: GitHub's stale known_hosts entries
  hosts: render
  gather_facts: false
  vars:
    unit_published:
      - ssh-ed25519 AAAAed
      - ssh-rsa AAAArsa
    unit_cases:
      - name: published types are kept
        lines: ["github.com ssh-ed25519 AAAAed", "github.com ssh-rsa AAAArsa"]
        expect: []
      - name: ssh-dss is selected
        lines: ["github.com ssh-ed25519 AAAAed", "github.com ssh-dss AAAAdss"]
        expect: ["ssh-dss AAAAdss"]
      - name: a rotated key of a published type is selected
        lines: ["github.com ssh-rsa AAAAold"]
        expect: ["ssh-rsa AAAAold"]
      - name: a multi-host line is selected
        lines: ["github.com,192.0.2.1 ssh-dss AAAAdss comment"]
        expect: ["ssh-dss AAAAdss"]
      - name: other hosts, comments and markers are ignored
        lines:
          - "gitlab.com ssh-dss AAAAdss"
          - "# github.com ssh-dss AAAAdss"
          - "@cert-authority github.com ssh-dss AAAAdss"
          - "notgithub.com ssh-dss AAAAdss"
        expect: []
      - name: no known_hosts at all
        lines: []
        expect: []
  tasks:
    - name: Check each case
      ansible.builtin.include_tasks: tasks/github_stale_case.yml
      loop: "{{ unit_cases }}"
      loop_control:
        loop_var: unit_case
        label: "{{ unit_case.name }}"
